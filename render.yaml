services:
  - type: web
    name: orca-marine-intelligence
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: LIVE
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: WEATHER_PROVIDER
        value: open-meteo
      - key: MARINE_PROVIDER
        value: open-meteo
